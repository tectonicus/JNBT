name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Validates the Gradle wrapper checksum and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles, runs the tests and checks the Javadoc.
      - name: Build
        run: ./gradlew build
